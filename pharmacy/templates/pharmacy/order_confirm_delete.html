{% extends 'pharmacy/base.html' %}
{% block content %}
<h1>Удаление заказа</h1>
<p>Вы уверены, что хотите удалить заказ #{{ object.pk }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'order_list' %}" class="btn">Отмена</a>
</form>
{% endblock %}

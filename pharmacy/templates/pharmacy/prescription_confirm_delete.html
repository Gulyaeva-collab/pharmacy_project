{% extends 'pharmacy/base.html' %}
{% block content %}
<h1>Удаление рецепта</h1>
<p>Вы уверены, что хотите удалить рецепт №{{ object.number }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'prescription_list' %}" class="btn">Отмена</a>
</form>
{% endblock %}

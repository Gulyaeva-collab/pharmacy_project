{% extends 'pharmacy/base.html' %}
{% block content %}
<h1>Удаление лекарства</h1>
<p>Вы уверены, что хотите удалить "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'medicine_list' %}" class="btn">Отмена</a>
</form>
{% endblock %}

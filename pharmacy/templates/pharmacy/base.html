<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Аптека{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        nav { background: #2c3e50; padding: 15px; display: flex; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        .btn { display: inline-block; padding: 8px 12px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; margin: 5px 0; }
        .btn-danger { background: #e74c3c; }
        .btn-edit { background: #f39c12; }
        .item-row { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; align-items: center; gap: 15px; }
        img { border-radius: 4px; object-fit: cover; }
        form p { margin-bottom: 15px; }
        form input, form select { padding: 8px; width: 100%; box-sizing: border-box; }
        .actions { margin-top: 10px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'medicine_list' %}">Лекарства</a>
        <a href="{% url 'component_list' %}">Компоненты</a>
        <a href="{% url 'order_list' %}">Заказы</a>
        <a href="{% url 'employee_list' %}">Сотрудники</a>
        <a href="{% url 'prescription_list' %}">Рецепты</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
